<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسأل — مساعد ذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171f;
    --ink-soft:#1c202b;
    --gold:#e0a93b;
    --gold-accent:#d9a441;
    --paper:#f2efe6;
    --paper-dim:#a9a89c;
    --line:#2b3040;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Tajawal',sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* subtle radial glow, single orchestrated backdrop, no per-card gimmicks */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% -5%, rgba(217,164,65,0.12), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  header{
    position:relative;
    z-index:1;
    text-align:center;
    padding:2.2rem 1.2rem 1rem;
  }
  header h1{
    font-family:'Noto Kufi Arabic', sans-serif;
    font-weight:700;
    font-size:1.6rem;
    letter-spacing:0;
    color:var(--paper);
  }
  header h1 span{ color:var(--gold-accent); }
  header p{
    margin-top:.4rem;
    color:var(--paper-dim);
    font-size:.9rem;
    font-weight:300;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:640px;
    width:100%;
    margin:0 auto;
    padding:0 1rem;
    position:relative;
    z-index:1;
    min-height:0;
  }

  #log{
    flex:1;
    overflow-y:auto;
    padding:1rem 0 1.5rem;
    display:flex;
    flex-direction:column;
    gap:1rem;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  #log:empty::before{
    content:"اكتب أي سؤال يخطر ببالك — تاريخ، علوم، برمجة، أو مجرد دردشة.";
    display:block;
    color:var(--paper-dim);
    text-align:center;
    padding:3rem 1rem;
    font-size:.95rem;
    line-height:1.9;
  }

  .msg{
    max-width:85%;
    line-height:1.85;
    font-size:.98rem;
    padding:.85rem 1.1rem;
    border-radius:14px;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--gold-accent);
    color:#1a1206;
    border-bottom-left-radius:4px;
    font-weight:500;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--ink-soft);
    border:1px solid var(--line);
    color:var(--paper);
    border-bottom-right-radius:4px;
  }
  .msg.bot.loading{
    color:var(--paper-dim);
    font-style:normal;
  }
  .dots span{
    display:inline-block;
    width:6px;height:6px;
    margin-inline-end:4px;
    border-radius:50%;
    background:var(--paper-dim);
    animation:blink 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){animation-delay:.2s;}
  .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{
    0%,80%,100%{opacity:.25;}
    40%{opacity:1;}
  }

  form{
    display:flex;
    gap:.6rem;
    padding:1rem 0 1.3rem;
    border-top:1px solid var(--line);
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--paper);
    font-family:inherit;
    font-size:.95rem;
    padding:.75rem 1rem;
    line-height:1.5;
    max-height:120px;
    min-height:48px;
  }
  textarea:focus{
    outline:none;
    border-color:var(--gold-accent);
  }
  textarea::placeholder{ color:var(--paper-dim); }

  button{
    background:var(--gold-accent);
    color:#1a1206;
    border:none;
    border-radius:12px;
    padding:0 1.3rem;
    font-family:inherit;
    font-weight:700;
    font-size:.95rem;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:disabled{ opacity:.5; cursor:default; }
  button:not(:disabled):hover{ opacity:.88; }
  button:focus-visible, textarea:focus-visible{
    outline:2px solid var(--gold-accent);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    .dots span{ animation:none; opacity:.6; }
  }
</style>
</head>
<body>

<header>
  <h1>MFK</h1>
  <p>مساعد ذكاء اصطناعي يجاوبك على أي سؤال</p>
</header>

<main>
  <div id="log"></div>
  <form id="chat-form">
    <textarea id="input" placeholder="اكتب سؤالك هنا..." rows="1" required></textarea>
    <button type="submit" id="send-btn">إرسال</button>
  </form>
</main>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  const history = [];

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  function addMessage(text, role){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addLoading(){
    const div = document.createElement('div');
    div.className = 'msg bot loading';
    div.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if(!question) return;

    addMessage(question, 'user');
    history.push({ role: 'user', content: question });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const loadingEl = addLoading();

    try{
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });

      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      const answer = textBlock ? textBlock.text : (data.error || 'تعذر الحصول على رد، حاول مرة أخرى.');

      loadingEl.remove();
      addMessage(answer, 'bot');
      history.push({ role: 'assistant', content: answer });

    }catch(err){
      loadingEl.remove();
      addMessage('حدث خطأ في الاتصال، حاول مرة أخرى.', 'bot');
      console.error(err);
    }finally{
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
